<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Shadow Tower</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #ece7dc;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none; overscroll-behavior: none;
  }
  #game { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<!-- The portal, loaded only where there is one.
     CrazyGames serves a game inside a frame, so a page that is its own top window is not on the
     portal: a local server, GitHub Pages, a file opened by hand. Loaded there anyway, the SDK
     logs "CrazySDK is not initialized yet" on every call and throws a rejection nobody can
     catch - four errors in the console of a game that is working perfectly.
     `src/ads.js` checks for `window.CrazyGames` and falls through when it is absent. -->
<script>
  if (window.self !== window.top) {
    var sdkTag = document.createElement('script');
    sdkTag.src = 'https://sdk.crazygames.com/crazygames-sdk-v3.js';
    document.head.appendChild(sdkTag);
  }
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
