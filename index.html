<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Shadow Tower</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #ece7dc;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none; overscroll-behavior: none;
  }
  #game { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<!-- The portal, loaded everywhere EXCEPT the places we know are not it.
     The other way round - loading it only inside a frame - was quieter but risky: CrazyGames QA
     may open the game directly rather than embedded, and then the SDK would never load and
     "Detected SDK functionalities" would come back empty, which fails the review. So the SDK
     loads by default and is skipped only on this machine, on GitHub Pages, and for `?nosdk`
     (the promo tool, which runs the game in a frame of its own).
     Off-portal the SDK logs "CrazySDK is not initialized yet" on every call and throws a
     rejection nothing can catch - four errors in the console of a game that is working. -->
<script>
  (function () {
    var host = location.hostname;
    var mine = host === 'localhost' || host === '127.0.0.1' || host === ''
      || /\.github\.io$/.test(host);
    // `?sdk` zorlar: gerçek SDK'yı bu makinede de yükleyip portal ortamını yerelde
    // tekrarlayabilmek için. `Tools/portal.mjs` bunu kullanıyor.
    var force = location.search.indexOf('sdk=1') >= 0;
    if (!force && (mine || location.search.indexOf('nosdk') >= 0)) return;
    var tag = document.createElement('script');
    tag.src = 'https://sdk.crazygames.com/crazygames-sdk-v3.js';
    document.head.appendChild(tag);
  })();
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
