<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shadow Tower — covers</title>
<style>html,body{margin:0;padding:0;background:#ece7dc;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="cover"></canvas>
<script type="module">
  import { drawCover } from './cover-art.js';
  const c = document.getElementById('cover');

  // İllüstrasyon varsa o, yoksa oyunun kendi çizimi. Bulunamaması bir hata değil: araç
  // illüstrasyonsuz da üç kapağı üretiyor.
  let art = null;
  const img = new Image();
  const got = new Promise((done) => {
    img.onload = () => { art = img; done('illüstrasyon'); };
    img.onerror = () => done('kendi çizimi');
  });
  img.src = '../Art/cover_raw.png';

  window.paint = (w, h) => {
    c.width = w; c.height = h;
    c.style.width = w + 'px'; c.style.height = h + 'px';
    drawCover(c.getContext('2d'), w, h, art);
    return w + 'x' + h;
  };
  window.paintReady = () => got;
  console.log('[cover] ready');
</script>
</body>
</html>
